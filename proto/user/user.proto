syntax = "proto3";

package user;

// Go 代码生成到 ./user。
option go_package = "./user";

// =======================
// 公共消息
// =======================

message Empty {}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3; // 固定为 Bearer
  int64 access_expire = 4;  // Unix 时间戳（秒）
  int64 refresh_expire = 5; // Unix 时间戳（秒）
}

message UserSummary {
  int64 user_id = 1;
  string nickname = 2;
  string avatar = 3;
  string role = 4;   // USER、ADMIN
  int32 status = 5;  // 1 正常，0 禁用
}

message UserProfile {
  int64 user_id = 1;
  string email = 2;
  string nickname = 3;
  string avatar = 4;
  string bio = 5;
  int32 gender = 6;   // 0 未知，1 男，2 女
  string birthday = 7; // yyyy-MM-dd 格式
  string region = 8;
  string role = 9;
  int32 status = 10;
}

message PublicUserProfile {
  int64 user_id = 1;
  string nickname = 2;
  string avatar = 3;
  string bio = 4;
  int32 gender = 5;
  string region = 6;
}

message AuthResponse {
  TokenPair tokens = 1;
  UserSummary user = 2;
}

// =======================
// 鉴权与账号
// =======================

message SendEmailCodeRequest {
  string email = 1;
  string scene = 2; // register / reset_password / bind_email
}

message SendEmailCodeResponse {
  int32 next_retry_seconds = 1;
}

message VerifyEmailCodeRequest {
  string email = 1;
  string code = 2;
  string scene = 3; // register / reset_password / bind_email
}

message VerifyEmailCodeResponse {
  bool valid = 1;
}

message RegisterRequest {
  string email = 1;
  string code = 2;
  string password = 3;
  string nickname = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  int64 user_id = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message ResetPasswordRequest {
  string email = 1;
  string code = 2;
  string new_password = 3;
}

message ChangePasswordRequest {
  int64 user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message BindEmailRequest {
  int64 user_id = 1;
  string email = 2;
  string code = 3;
}

// =======================
// 用户资料
// =======================

message GetMyProfileRequest {
  int64 user_id = 1;
}

message GetPublicProfileRequest {
  int64 user_id = 1;
}

message UpdateProfileRequest {
  int64 user_id = 1;
  optional string nickname = 2;
  optional string avatar = 3;
  optional string bio = 4;
  optional int32 gender = 5;
  optional string birthday = 6; // yyyy-MM-dd
  optional string region = 7;
}

message UpdateUserStatusRequest {
  int64 user_id = 1;
  int32 status = 2;
}

// 管理员删除或用户注销
message DeleteUserRequest {
  int64 user_id = 1;
  string reason = 2;
}

message AdminDeleteUserRequest {
  int64 user_id = 1;
  string reason = 2;
}

// =======================
// 跨服务查询
// =======================

message GetUserSummaryRequest {
  int64 user_id = 1;
}

message BatchGetUsersRequest {
  repeated int64 user_ids = 1;
}

message BatchGetUsersResponse {
  map<int64, UserSummary> user_map = 1;
}

// =======================
// 服务定义
// =======================

service UserService {
  // 鉴权与账号
  rpc SendEmailCode(SendEmailCodeRequest) returns (SendEmailCodeResponse);
  rpc VerifyEmailCode(VerifyEmailCodeRequest) returns (VerifyEmailCodeResponse);
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse);
  rpc Logout(LogoutRequest) returns (Empty);
  rpc ResetPassword(ResetPasswordRequest) returns (Empty);
  rpc ChangePassword(ChangePasswordRequest) returns (Empty);
  rpc BindEmail(BindEmailRequest) returns (Empty);

  // 用户资料
  rpc GetMyProfile(GetMyProfileRequest) returns (UserProfile);
  rpc GetPublicProfile(GetPublicProfileRequest) returns (PublicUserProfile);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserProfile);
  rpc UpdateUserStatus(UpdateUserStatusRequest) returns (Empty);
  rpc DeleteUser(DeleteUserRequest) returns (Empty);
  rpc AdminDeleteUser(AdminDeleteUserRequest) returns (Empty);

  // 跨服务查询
  rpc GetUserSummary(GetUserSummaryRequest) returns (UserSummary);
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);
}
