  Hosts:
  - etcd:2379
  Key: notification.rpc
Metrics:
  Host: 0.0.0.0
  Port: 40095
  Path: /metrics
Mongo:
  Uri: "mongodb://mongo:27017"
  Database: "rednote"
RabbitMQ:
  DataSource: "${NOTIFICATION_RABBITMQ_URL}"
Mysql:
  DataSource: "${NOTIFICATION_MYSQL_DSN}"
